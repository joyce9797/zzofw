const criticalAssets = [

const heavyAssets = []; // 暫時先空著

let loadedCount = 0;
const totalCritical = criticalAssets.length;

function preloadImages(array, callback) {
    if (array.length === 0) return callback(); // 如果沒東西就直接結束

    array.forEach(src => {
        const img = new Image();
        img.src = src;
        
        // 成功載入
        img.onload = () => {
            loadedCount++;
            let percent = Math.floor((loadedCount / totalCritical) * 60);
            updateUI(percent);
            if (loadedCount === totalCritical) callback();
        };

        // 失敗處理 (預防圖片路徑寫錯卡死)
        img.onerror = () => {
            console.error("圖片載入失敗:", src);
            loadedCount++; // 即使失敗也算進去，否則進度條會卡死
            if (loadedCount === totalCritical) callback();
        };
    });
}

function updateUI(p) {
    const bar = document.getElementById('progress-bar');
    const text = document.getElementById('loading-percent');
    if (bar) bar.style.width = p + "%";
    if (text) text.innerText = p + "%";
}

function showOptions(options) {
    const container = document.getElementById('選項框');
    container.innerHTML = ""; // 1. 先清空上一次的選項
    container.style.display = 'flex'; // 2. 顯示大框框

    // 3. 根據資料裡的 options 有幾個，就生幾個按鈕
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.innerText = opt.text; // 設定按鈕文字
        btn.className = 'option-btn'; // 套用上面寫好的 CSS
        
        btn.onclick = (e) => {
            e.stopPropagation(); // 防止點到背景
            
            // 跳轉劇情
            currentStep = storyScript.findIndex(s => s.id === opt.nextId);
            container.style.display = 'none'; // 選完就關閉框框
            renderScene(currentStep); 
        };
        
        container.appendChild(btn); // 把按鈕塞進大框框
    });
}






let currentStep = 0; // 紀錄目前進行到哪一個劇情節點

    renderScene(currentStep);

// 2. 渲染場景的函式 (最重要！)
function renderScene(stepIndex) {
    const scene = storyScript[stepIndex];
    if (!scene) return;

    // 1. 更新對話文字與名字
    document.getElementById('對話文本').innerText = scene.text || "";
    document.getElementById('玩家').innerText = scene.speaker || "星辰";

    // 2. 先把所有人藏起來
    hideAllCharacters();

    // 3. 根據這一關的腳本，把需要的角色「秀出來」
    if (scene.characters) {
        scene.characters.forEach(charName => {
            const charImg = document.getElementById(charName);
            if (charImg) charImg.style.display = 'block'; 
        });
    }

    // 4. 角色秀出來之後，立刻執行對應的動畫
    if ([0].includes(scene.id)) { 
        starSlideIn();
    } else if ([1.5].includes(scene.id)) { 
        starGetScared();
    }

    // 5. ✨ 補回這段：處理選項顯示與渲染 ✨
    const optBox = document.getElementById('選項框');
    if (!optBox) return; // 安全機制，防止找不到元件

    if (scene.options) {
        optBox.innerHTML = "";      // 先清空上一次的按鈕
        optBox.style.display = 'flex'; // 顯示選項框
        
        scene.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt.text;
            btn.className = 'option-btn';
            
            // 點擊選項時的邏輯
            btn.onclick = (e) => {
                e.stopPropagation(); // 防止點擊按鈕觸發到背景的 nextStep()
                
                // 根據選項的 nextId 找到劇本中對應的陣列索引
                currentStep = storyScript.findIndex(s => s.id === opt.nextId);
                optBox.style.display = 'none'; // 隱藏選項
                renderScene(currentStep);      // 前進下一幕
            };
            optBox.appendChild(btn);
        });
    } else {
        optBox.style.display = 'none'; // 如果這一關沒有選項，就把框藏起來
    }
}

// 3. 點擊畫面推進劇情
// 在 HTML 的 #page1 或 body 加一個 onclick="nextStep()"
function nextStep() {
    // 如果現在有選項，就強制玩家必須選一個，不能直接點過
    const scene = storyScript[currentStep];
    if (scene.options) return;

    if (scene.nextId !== undefined) {
        // 如果有指定下一個 ID
        currentStep = storyScript.findIndex(s => s.id === scene.nextId);
    } else {
        // 否則就順著走下一個
        currentStep++;
    }

    if (currentStep < storyScript.length) {
        renderScene(currentStep);
    } else {
        alert("劇情結束！");
    }
}

    const chars = ["星辰","星辰害怕", "好奇星", "同情星", "爽快星", "熱情星"];
    chars.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = 'none';
    });
}

// 讓星辰從右邊滑進來
function starSlideIn() {
    const star = document.getElementById('星辰');
    if (star) {
        star.style.display = 'block';        /* ✨ 先讓它在舞台上出現 */
        star.classList.remove('slide-in-right'); 
        void star.offsetWidth;               /* 🔥 強迫瀏覽器刷新 */
        star.classList.add('slide-in-right');    
    }
}

function starGetScared() {
    const starScared = document.getElementById('星辰害怕');
    if (starScared) {
        starScared.style.display = 'block';  /* ✨ 先讓它在舞台上出現 */
        starScared.classList.remove('scared-bounce'); 
        void starScared.offsetWidth;         /* 🔥 強迫瀏覽器刷新 */
        starScared.classList.add('scared-bounce');    
        
        starScared.addEventListener('animationend', () => {
            starScared.classList.remove('scared-bounce');
        }, { once: true });
    }
}
