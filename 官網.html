    <script>
    // 禁止右鍵（防止圖片被另存）
        document.addEventListener('contextmenu', event => event.preventDefault());

                   // 載入畫面
        // 1. 確保資源路徑正確 (檢查你的資料夾名稱)
        // 要先載完的東西
const criticalAssets = [
    '/pct/星辰.PNG', 
    
]; 
const heavyAssets = []; // 暫時先空著

let loadedCount = 0;
const totalCritical = criticalAssets.length;

function preloadImages(array, callback) {
    if (array.length === 0) return callback(); // 如果沒東西就直接結束

    array.forEach(src => {
        const img = new Image();
        img.src = src;
        
        // 成功載入
        img.onload = () => {
            loadedCount++;
            let percent = Math.floor((loadedCount / totalCritical) * 60);
            updateUI(percent);
            if (loadedCount === totalCritical) callback();
        };

        // 失敗處理 (預防圖片路徑寫錯卡死)
        img.onerror = () => {
            console.error("圖片載入失敗:", src);
            loadedCount++; // 即使失敗也算進去，否則進度條會卡死
            if (loadedCount === totalCritical) callback();
        };
    });
}

function updateUI(p) {
    const bar = document.getElementById('progress-bar');
    const text = document.getElementById('loading-percent');
    if (bar) bar.style.width = p + "%";
    if (text) text.innerText = p + "%";
}

// 定義缺少的函式，避免報錯
function enterGameAnimation() {
    console.log("開始進入遊戲動畫");
    // 讓 Loading 畫面消失
    document.getElementById('loading-screen').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
    }, 1000);
}

function backgroundLoad(assets) {
    console.log("後台載入中...");
}

// 執行
preloadImages(criticalAssets, () => {
    enterGameAnimation();
    backgroundLoad(heavyAssets);
});
// 漢堡選單
function toggleMenu() {
    const menu = document.getElementById("overlay-menu");
    // 如果寬度是 0 就展開，否則就縮回
    if (menu.style.width === "100%") {
        menu.style.width = "0%";
    } else {
        menu.style.width = "100%";
    }
}
// 偵測角色介紹區塊是否進入畫面
// 1. 建立監視器
const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
        if (entry.isIntersecting) {
            entry.target.classList.add('show');
            // 如果只需要跑一次動畫，觸發後就停止監視該元素
            observer.unobserve(entry.target); 
        }
    });
}, {
    threshold: 0.15 // 稍微露出一點點就觸發
});

// 2. 啟動監視 (確保在頁面載入後執行)
document.addEventListener('DOMContentLoaded', () => {
    // 這裡的選擇器要跟 CSS 對應
    const elementsToWatch = document.querySelectorAll('.character img, .intro-title, .intro');
    
    elementsToWatch.forEach((el) => {
        observer.observe(el);
    });
});
    </script>
